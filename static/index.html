<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Generative Zoom</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="page-header">
  <h1>Generative Zoom</h1>
  <button id="openImage" class="primary" type="button">Open image</button>
  <input id="upload" hidden type="file" accept="image/*">
</header>
<div class="layout">
  <main aria-label="Image workspace">
    <div class="view-bar">
      <div class="navigation">
        <button id="back" type="button" disabled>Back one zoom</button>
        <button id="resetView" type="button" disabled>Original image</button>
      </div>
      <output id="zoomScale" aria-label="Magnification">1×</output>
    </div>
    <div id="stage" class="stage">
      <canvas id="canvas" width="1024" height="1024" tabindex="0"
              aria-label="Zoomable image" aria-describedby="canvasHelp"></canvas>
      <div id="emptyView" class="empty-view">Drop an image here</div>
      <div id="cropGuide" class="crop-guide" hidden></div>
      <div id="clickGuide" class="click-guide" hidden></div>
    </div>
    <div class="info-bar">
      <div>
        <p id="status" role="status">Open or drop an image to start.</p>
        <p id="timings" class="timings"></p>
      </div>
      <label class="compare">View
        <select id="view" disabled>
          <option value="image">Blended result</option>
          <option value="raw">Raw generation</option>
          <option value="baseline">Lanczos baseline</option>
        </select>
      </label>
    </div>
    <p id="canvasHelp" class="hint">Tap or click to zoom. <span>With the image focused, use arrow keys to aim and Enter to zoom. Backspace goes back.</span></p>
  </main>
  <aside aria-label="Zoom settings">
    <section class="panel">
      <h2>Zoom settings</h2>
      <p id="warmupStatus" class="notice" role="status" hidden></p>
      <label>Backend
        <select id="backend">
          <option value="diffusion">SD-Turbo</option>
          <option id="openvinoBackend" value="openvino" hidden>SD-Turbo · OpenVINO</option>
          <option value="z-image">Z-Image-Turbo · 1024×1024</option>
          <option value="upscale">Lanczos only</option>
        </select>
      </label>
      <div class="paired">
        <label>Zoom per click <select id="zoomFactor"><option value="2" selected>2×</option><option value="4">4×</option></select></label>
        <label>Refinement steps <select id="refinementSteps"><option value="1" selected>1 step</option></select></label>
      </div>
      <label class="check"><input id="preserveStructure" type="checkbox" checked> Preserve source structure</label>
    </section>
    <section class="panel">
      <h2>Artistic direction</h2>
      <label>Preset <select id="preset"><option value="">Choose a preset</option><option value="natural">Living ecosystem</option><option value="architecture">Nested architecture</option><option value="surreal">World within a world</option><option value="material">Material microstructure</option></select></label>
      <label>Prompt hint (optional)<textarea id="prompt" rows="3" maxlength="2000" placeholder="Describe the selected area or suggest a style"></textarea></label>
      <label>Prompt mode
        <select id="promptMode">
          <option value="crop">Crop / manual prompt</option>
          <option id="backgroundOption" value="background" hidden>Background Qwen</option>
          <option value="wait" selected>Wait for Qwen</option>
        </select>
      </label>
      <p id="promptStatus" class="hint" role="status" hidden></p>
      <label id="variationRow">Detail variation <select id="variation"><option value="gentle">Gentle</option><option value="medium" selected>Medium</option><option value="surprising">Surprising</option></select></label>
      <details id="promptDetails" hidden>
        <summary id="promptSummary">Prompt used for the last image</summary>
        <p id="detailHeading" class="detail-heading"></p>
        <p id="detailDirection"></p>
        <p id="cropObservation"></p>
        <p id="usedPrompt"></p>
      </details>
    </section>
    <details class="panel advanced">
      <summary>Advanced settings</summary>
      <label>Pre-noise sharpening <input id="sharpen" type="number" min="0" max="3" step="any" value="0" required></label>
      <label>Border feather (px at 512px) <input id="feather" type="number" min="0" max="128" value="32" required></label>
      <label>Seed <input id="seed" type="number" min="0" max="2147483647" value="42" required></label>
    </details>
  </aside>
</div>
<script type="module" src="static/app.js"></script>
</body></html>
